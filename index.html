<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赛智通 EventFlow</title><link rel="stylesheet" href="eventflow-app.css?v=20260912b"></head><body class="login-page"><main class="login-layout"><section class="login-copy"><div class="brand-mark">EF</div><h1>让办赛像发朋友圈<br>一样简单。</h1><p>赛智通 EventFlow 是面向中小型赛事的智能办赛助手，以自研编排引擎为核心，把报名、编排、计分与协作连接在一条实时工作流中。</p><div class="login-proof"><div><b>99%</b><span>编排耗时缩短</span></div><div><b>80%</b><span>办赛效率提升</span></div><div><b>6+</b><span>首批覆盖项目</span></div></div></section><section class="login-card"><h2>进入 EventFlow</h2><p>输入账户名与密码登录，再选择工作身份。</p><form id="login-form"><label class="field"><span>账户名</span><input class="ef-input" id="login-account" type="text" placeholder="请输入账户名" autocomplete="username"></label><label class="field" style="margin-top:13px"><span>密码</span><input class="ef-input" id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password"></label><p id="login-error" style="color:var(--red);font-size:11px;margin:10px 0 0;display:none"></p><button class="primary-button" type="submit" style="margin-top:16px">登录</button></form><p class="workspace-note">演示账号：organizer / referee / participant，密码均为 123456。赛智通采用 SaaS 云服务模式；演示版数据保存在本地浏览器，可完整体验办赛全流程。</p></section></main><script src="ef-data.js?v=20260912b"></script><script src="ef-ui.js?v=20260912b"></script><script src="login.js?v=20260912b"></script></body></html>
